name: Antigravity CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  agent_review_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Antigravity CLI 설치하기
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Antigravity API 키 모드 설정
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          echo '{ "modelProvider": "gemini" }' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: Antigravity 에이전트 코드 점검
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          agy -p "이 프로젝트의 최근 수정된 코드를 분석해 줘. 특히 OpenAI API 연동 부분과 Supabase 데이터베이스 접근 시 보안 취약점이나 메모리 누수 문제가 없는지 꼼꼼히 점검해. 문제가 발견되면 비정상 종료(Exit 1)하고, 통과하면 요약 리포트를 작성해." --output-format text > review.md
          cat review.md

      - name: 리뷰 리포트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-review
          path: review.md

      - name: 실서버 배포 (리뷰 통과 시)
        run: echo "안티그래비티의 에이전트 리뷰를 무사히 통과했습니다! Vercel로 배포를 시작합니다."
