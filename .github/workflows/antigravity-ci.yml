name: Antigravity CI/CD Pipeline

# Kiro 등으로 작성/수정한 코드가 올라오면 Google Antigravity 에이전트가
# 자동으로 보안 취약점과 에러를 검사한다.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  agent_security_review:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Antigravity CLI 설치하기
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Antigravity API 키 모드 설정
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          echo '{ "modelProvider": "gemini" }' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: Antigravity 보안 취약점 및 에러 검사
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # plan 모드: 에이전트가 파일을 수정하지 않고 분석/리포트만 하도록 고정 (CI 비대화 환경에 적합)
          agy -p "이 프로젝트의 소스 코드를 읽고 보안/품질 관점에서 분석 리포트만 작성해 줘. 파일을 수정하거나 명령을 실행하지 말고, 다음을 점검해: 하드코딩된 비밀키, 인젝션, 안전하지 않은 입력 처리, 잘못된 인증/인가, 명백한 버그와 런타임 에러, 리소스/메모리 누수. 발견한 문제와 심각도, 권장 조치를 요약해 줘." \
            --model gemini-3.8-flash \
            --effort low \
            --mode plan \
            --print-timeout 5m \
            --output-format text > review.md
          echo "===== Antigravity 검사 리포트 ====="
          cat review.md

      - name: 리뷰 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-review
          path: review.md

      - name: 실서버 배포 (검사 통과 시)
        if: success()
        run: echo "Antigravity 보안 검사를 통과했습니다! 배포를 시작합니다."
        # 실제 배포 명령어 (예: npx vercel --prod)가 들어갈 자리입니다.
