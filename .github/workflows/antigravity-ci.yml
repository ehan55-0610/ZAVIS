name: Antigravity CI/CD Pipeline

# Kiro 등으로 작성/수정한 코드가 올라오면 Google Antigravity 에이전트가
# 자동으로 보안 취약점과 에러를 검사한다.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  agent_security_review:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Antigravity CLI 설치하기
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Antigravity API 키 모드 설정
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          echo '{ "modelProvider": "gemini" }' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: Antigravity 보안 취약점 및 에러 검사
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # print 모드로 분석 리포트를 stdout -> review.md 로 저장한다.
          # (plan 모드는 출력이 비어버리는 문제가 있어 사용하지 않는다.)
          agy -p "너는 보안 코드 리뷰어다. 이 저장소의 소스 코드를 읽고, 아래 항목을 점검한 텍스트 분석 리포트를 반드시 출력해라. 파일을 수정하거나 명령을 실행하지 말고 리포트 텍스트만 출력해라. 점검 항목: 하드코딩된 비밀키/토큰, 인젝션, 안전하지 않은 입력 처리, 잘못된 인증/인가, 명백한 버그와 런타임 에러, 리소스/메모리 누수. 출력 형식: (1) 요약 (2) 발견한 이슈 목록(심각도 포함) (3) 권장 조치. 심각한 문제가 없으면 심각한 문제 없음 이라고 명시해라." \
            --model gemini-3.8-flash \
            --effort low \
            --print-timeout 5m \
            --output-format text | tee review.md

          echo "===== Antigravity 검사 리포트 (review.md) ====="
          cat review.md
          if [ ! -s review.md ]; then
            echo "::warning::review.md 가 비어 있습니다. 에이전트가 리포트를 출력하지 못했습니다."
          fi

      - name: 리뷰 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-review
          path: review.md

      - name: 실서버 배포 (검사 통과 시)
        if: success()
        run: echo "Antigravity 보안 검사를 통과했습니다! 배포를 시작합니다."
        # 실제 배포 명령어 (예: npx vercel --prod)가 들어갈 자리입니다.